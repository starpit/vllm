[workspace]
resolver = "2"
members = [
    "crates/vllm-common",
    "crates/vllm-config",
    "crates/vllm-core",
    "crates/vllm-engine",
    "crates/vllm-serve",
    "crates/vllm-executor",
    "crates/vllm-model",
    "crates/vllm-models",
    "crates/vllm-protocol",
    "crates/vllm-pyo3",
    "crates/vllm-bench",
    "crates/vllm-cli",
    "crates/vllm-mlx",
    "crates/vllm-e2e",
    "crates/vllm-wgpu",
    "crates/vllm-cuda",
    "crates/vllm-examples",
    "crates/vllm-parity",
    "crates/vllm-gce",
]
exclude = []

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/vllm-project/vllm"

[workspace.dependencies]
# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rmp-serde = "1"
bincode = "1"

# Date/time
chrono = { version = "0.4", default-features = false, features = ["clock"] }

# Async runtime
tokio = { version = "1", features = ["full"] }

# HTTP/gRPC
axum = "0.8"
axum-server = { version = "0.8", features = ["tls-rustls"] }
rustls = { version = "0.23", features = ["aws-lc-rs"] }
rustls-pemfile = "2"
tonic = "0.13"
tower = "0.5"

# Python interop
pyo3 = { version = "0.23", features = ["extension-module"] }

# Logging/tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "registry"] }

# OpenTelemetry (optional, behind "otel" feature)
opentelemetry = "0.31"
opentelemetry_sdk = { version = "0.31", features = ["rt-tokio"] }
opentelemetry-otlp = { version = "0.31", features = ["grpc-tonic"] }
tracing-opentelemetry = "0.32"

# Metrics
prometheus = "0.13"

# Error handling
thiserror = "2"
anyhow = "1"
dotenvy = "0.15"

# System info
libc = "0.2"
core-foundation = "0.10"

# Parallelism
rayon = "1"

# Collections / utilities
indexmap = { version = "2", features = ["serde"] }
hashbrown = "0.15"
smallvec = "1"
bytes = "1"
rand = "0.8"

# ZeroMQ
zeromq = "0.4"

# Tokenizer
tokenizers = "0.22"

# Template engine (for HuggingFace chat templates)
minijinja = { version = "2", features = ["builtins", "json", "loader"] }
minijinja-contrib = { version = "2", features = ["pycompat"] }

# Structured output / constrained decoding
llguidance = { version = "1.6" }
toktrie = { version = "1.6" }
toktrie_hf_tokenizers = { version = "1.6" }

# Tensor ops
candle-core = { version = "0.9", default-features = false }
# CUDA (NVIDIA GPU) — must match candle-core's cudarc version
cudarc = { version = "0.19", default-features = false, features = ["std", "driver", "f16"] }
safetensors = "0.7"
half = "2.7"
memmap2 = "0.9"

# MLX (Apple Silicon)
mlx-rs = { version = "0.25", features = ["metal", "accelerate", "safetensors"] }

# HuggingFace Hub
hf-hub = "0.4"
indicatif = "0.17"

# CLI
clap = { version = "4", features = ["derive", "env"] }

# Streaming
tokio-stream = "0.1"
futures-util = "0.3"

# TUI (for `vllm top`)
ratatui = "0.29"
crossterm = "0.28"

# Testing
tempfile = "3"
rcgen = "0.14"

# HTTP client (for E2E tests)
reqwest = { version = "0.12", features = ["json", "stream"] }

# Internal workspace crates
vllm-common = { path = "crates/vllm-common" }
vllm-config = { path = "crates/vllm-config" }
vllm-core = { path = "crates/vllm-core" }
vllm-engine = { path = "crates/vllm-engine" }
vllm-serve = { path = "crates/vllm-serve" }
vllm-executor = { path = "crates/vllm-executor" }
vllm-model = { path = "crates/vllm-model" }
vllm-models = { path = "crates/vllm-models" }
vllm-protocol = { path = "crates/vllm-protocol" }
vllm-bench = { path = "crates/vllm-bench" }
vllm-cli = { path = "crates/vllm-cli" }
vllm-mlx = { path = "crates/vllm-mlx" }
vllm-e2e = { path = "crates/vllm-e2e" }
vllm-wgpu = { path = "crates/vllm-wgpu" }
vllm-cuda = { path = "crates/vllm-cuda" }
vllm-examples = { path = "crates/vllm-examples" }
vllm-gce = { path = "crates/vllm-gce" }

# WebGPU
wgpu = { version = "24", features = ["wgsl"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = "0.3"
js-sys = "0.3"
serde-wasm-bindgen = "0.6"

[patch.crates-io]
cudaforge = { path = "third_party/cudaforge" }
