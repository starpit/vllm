[workspace]
resolver = "2"
members = [
    "crates/vllm-common",
    "crates/vllm-config",
    "crates/vllm-core",
    "crates/vllm-engine",
    "crates/vllm-serve",
    "crates/vllm-executor",
    "crates/vllm-model",
    "crates/vllm-models",
    "crates/vllm-kernels",
    "crates/vllm-protocol",
    "crates/vllm-pyo3",
    "crates/vllm-cli",
    "crates/vllm-mlx",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/vllm-project/vllm"

[workspace.dependencies]
# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rmp-serde = "1"

# Async runtime
tokio = { version = "1", features = ["full"] }

# HTTP/gRPC
axum = "0.8"
tonic = "0.13"
tower = "0.5"

# Python interop
pyo3 = { version = "0.23", features = ["extension-module"] }

# Logging/tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Metrics
prometheus = "0.13"

# Error handling
thiserror = "2"
anyhow = "1"

# Collections / utilities
indexmap = { version = "2", features = ["serde"] }
hashbrown = "0.15"
smallvec = "1"
bytes = "1"
rand = "0.8"

# ZeroMQ
zeromq = "0.4"

# Tokenizer
tokenizers = "0.22"

# Template engine (for HuggingFace chat templates)
minijinja = { version = "2", features = ["builtins"] }

# Tensor ops
candle-core = "0.9"
safetensors = "0.7"
half = "2.7"
memmap2 = "0.9"

# MLX (Apple Silicon)
mlx-rs = { version = "0.25", features = ["metal", "accelerate", "safetensors"] }

# HuggingFace Hub
hf-hub = "0.4"
indicatif = "0.17"

# CLI
clap = { version = "4", features = ["derive", "env"] }

# Testing
tempfile = "3"

# Internal workspace crates
vllm-common = { path = "crates/vllm-common" }
vllm-config = { path = "crates/vllm-config" }
vllm-core = { path = "crates/vllm-core" }
vllm-engine = { path = "crates/vllm-engine" }
vllm-serve = { path = "crates/vllm-serve" }
vllm-executor = { path = "crates/vllm-executor" }
vllm-model = { path = "crates/vllm-model" }
vllm-models = { path = "crates/vllm-models" }
vllm-kernels = { path = "crates/vllm-kernels" }
vllm-protocol = { path = "crates/vllm-protocol" }
vllm-cli = { path = "crates/vllm-cli" }
vllm-mlx = { path = "crates/vllm-mlx" }
