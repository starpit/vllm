[package]
name = "ferrite-cuda-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Core GPU types for the ferrite inference framework"

[features]
default = []
cuda = ["dep:cudarc"]
nccl = ["cuda", "cudarc/nccl"]
# Metal backend: pulls in metal-rs for the `MetalAllocator` impl of
# `DeviceAllocator`. Mutually exclusive with `cuda` at build time.
metal = ["dep:metal"]

[dependencies]
cudarc = { workspace = true, optional = true, features = ["cublas", "cublaslt", "dynamic-linking", "cuda-version-from-build-system"] }
metal = { version = "0.29", optional = true }
half = { workspace = true }
rayon = { workspace = true }
safetensors = { workspace = true }
memmap2 = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
libc = { workspace = true }
vllm-model = { path = "../vllm-model" }
ferrite-gguf = { path = "../ferrite-gguf" }
inventory = { workspace = true }

[build-dependencies]
dirs = "6"
