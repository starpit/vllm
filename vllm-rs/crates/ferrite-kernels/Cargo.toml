[package]
name = "ferrite-kernels"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "GPU kernel wrappers and layer types for the ferrite inference framework"

[features]
default = []
# `cuda` pulls in the cudarc dep (whose build script requires `nvcc`)
# alongside `ferrite-cuda-core/cuda`. Without it, the crate compiles
# the layer struct *types* (RmsNorm, LinearLayer, …) but no kernel
# wrappers — sufficient for backends that consume `Instruction<W>`
# (e.g. ferrite-metal) on machines without a CUDA toolkit.
cuda = ["dep:cudarc", "ferrite-cuda-core/cuda"]
nccl = ["cuda", "ferrite-cuda-core/nccl"]

[dependencies]
ferrite-cuda-core = { path = "../ferrite-cuda-core" }
cudarc = { workspace = true, optional = true, features = ["cublas", "cublaslt", "dynamic-linking", "cuda-version-from-build-system"] }
half = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
serde_json = { workspace = true }
vllm-model = { path = "../vllm-model" }
ferrite-gguf = { path = "../ferrite-gguf" }
inventory = { workspace = true }
