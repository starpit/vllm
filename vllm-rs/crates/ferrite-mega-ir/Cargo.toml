[package]
name = "ferrite-mega-ir"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Typed correct-by-construction IR for ferrite megakernel emission. Sealed Substrate trait + sealed witnesses ensure a MegaTape value cannot exist unless the megakernel it lowers to is provably free of page-slot lifecycle, mbarrier phase, scratch overlap, and warp-role bug classes."

[features]
default = []
# Forward `ferrite-forward/nccl` so this crate's `Instruction` match
# in `lower::variant_name` reaches the `AllReduce` / `AllGather`
# variants when the consumer enabled tensor parallel.
nccl = ["ferrite-forward/nccl"]

[dependencies]
# Per `MEGA_IR_PLAN.md` §5, the lowering input is the existing
# `Vec<Instruction>` semantic tape from `ferrite-forward::instr`.
# `Instruction` is ungated (the cuda-only items are
# `WeightAccessors` / `InterpreterCtx` / `run` / `debug_dump`), so
# this dep does NOT enable `cuda` — keeps mega-ir free of
# ferrite-kernels' extern CUDA symbols.
ferrite-forward = { path = "../ferrite-forward" }

# Compile-fail tests for const-generic substrate-proof rejection
# live in `tests/compile_fail.rs` and shell out to `rustc` directly.
# trybuild's primary-span filter rejects post-monomorphization E0080
# const-eval errors (the primary span lands in `core::panic`), so we
# don't use it; the hand-rolled driver works around it without
# adding a dev-dep.
