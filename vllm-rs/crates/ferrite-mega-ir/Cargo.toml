[package]
name = "ferrite-mega-ir"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Typed correct-by-construction IR for ferrite megakernel emission. Sealed Substrate trait + sealed witnesses ensure a MegaTape value cannot exist unless the megakernel it lowers to is provably free of page-slot lifecycle, mbarrier phase, scratch overlap, and warp-role bug classes."

[features]
default = []

[dependencies]
# `ferrite-mega-ir` has zero external deps. The const-generic
# `MegaTapeBuilder` API doesn't consume `Instruction` at runtime
# — the proc-macro emits literal `push_*::<...>(weight_path)`
# calls at expansion time, monomorphizing them at user build.
# This lets `ferrite-forward` re-export `ferrite-mega-ir` without
# closing a `mega-ir → ferrite-forward → mega-ir` cycle.

# Compile-fail tests for const-generic substrate-proof rejection
# live in `tests/compile_fail.rs` and shell out to `rustc` directly.
# trybuild's primary-span filter rejects post-monomorphization E0080
# const-eval errors (the primary span lands in `core::panic`), so we
# don't use it; the hand-rolled driver works around it without
# adding a dev-dep.
