[package]
name = "ferrite-metal-kernels"
version = "0.1.0"
edition = "2021"

[dependencies]
metal = "0.29"
objc = "0.2"
foreign-types = "0.5"
ferrite-metal-targets = { path = "../ferrite-metal-targets" }
half = "2.3"
libm = "0.2"

[dev-dependencies]
criterion = "0.5"

[build-dependencies]
cc = "1.0"

[[bench]]
name = "attention_benchmark"
harness = false

[[bench]]
name = "fused_kernels_benchmark"
harness = false

[[bench]]
name = "awq_benchmark"
harness = false
