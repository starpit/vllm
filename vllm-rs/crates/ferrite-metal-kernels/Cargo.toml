[package]
name = "ferrite-metal-kernels"
version = "0.1.0"
edition = "2021"

[dependencies]
objc2 = "0.6"
objc2-metal = { version = "0.3", features = ["dispatch2"] }
objc2-foundation = "0.3"
dispatch2 = "0.3"
ferrite-metal-targets = { path = "../ferrite-metal-targets" }
half = "2.3"
libm = "0.2"

[dev-dependencies]
criterion = "0.5"

# build.rs uses only `xcrun` via std::process::Command — no crate
# dependencies needed.

[[bench]]
name = "attention_benchmark"
harness = false

[[bench]]
name = "fused_kernels_benchmark"
harness = false
