[package]
name = "ferrite-model-phi3"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Ferrite Phi-3 architecture (one #[forward] body)"

[features]
default = []
cuda = ["ferrite-cuda-core/cuda", "ferrite-kernels/cuda", "ferrite-forward/cuda"]
# Tensor-parallel: forwards through to ferrite-forward/nccl, which gates the
# `Instruction::AllReduce` variant + `ForwardCtx::tp_group` field. Until task
# #7 emits tp>1 variants, enabling this feature still produces a tp=1 build —
# the lowering pass remains a no-op and zero `Instruction::AllReduce` literals
# are emitted. After task #7 turns on, this feature is required for the
# emitted tp>1 variant modules to compile.
nccl = ["cuda", "ferrite-cuda-core/nccl", "ferrite-kernels/nccl", "ferrite-forward/nccl"]
# Metal backend on Apple Silicon. Phi-3 needs LongRoPE (su-scaling) which the
# metal `RotaryCache::new_from_gpuweights` doesn't yet implement — the macro
# emits `compile_error!` for that scaling family until a metal counterpart
# lands. Declared as an empty feature here so the `#[cfg(feature = "metal")]`
# arms the `#[forward]` macro emits parse cleanly under `--check-cfg`; the
# real wiring (`metal = ["ferrite-forward/metal"]`) gets restored once
# `new_longrope_from_gpuweights` (and `new_partial_longrope_from_gpuweights`)
# land in `ferrite-forward-macro/src/codegen.rs`.
metal = []

[dependencies]
ferrite-cuda-core = { path = "../ferrite-cuda-core" }
ferrite-kernels = { path = "../ferrite-kernels" }
ferrite-forward-macro = { path = "../ferrite-forward-macro" }
ferrite-forward = { path = "../ferrite-forward" }
ferrite-gguf = { path = "../ferrite-gguf" }
anyhow = { workspace = true }
tracing = { workspace = true }
