[package]
name = "ferrite-model-qwen2-vl"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Ferrite Qwen2-VL vision tower (text decoder is shared via ferrite-model-qwen2)"

[features]
default = []
cuda = ["ferrite-cuda-core/cuda", "ferrite-kernels/cuda", "ferrite-forward/cuda"]
nccl = ["cuda", "ferrite-cuda-core/nccl", "ferrite-kernels/nccl", "ferrite-forward/nccl"]

[dependencies]
ferrite-cuda-core = { path = "../ferrite-cuda-core" }
ferrite-kernels = { path = "../ferrite-kernels" }
ferrite-forward = { path = "../ferrite-forward" }
anyhow = { workspace = true }
tracing = { workspace = true }
half = { workspace = true }
