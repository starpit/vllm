[package]
name = "ferrite-models"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Ferrite model architectures using #[forward] macro"

[features]
default = []
cuda = [
    "ferrite-model-commandr/cuda",
    "ferrite-model-gemma2/cuda",
    "ferrite-model-gemma3/cuda",
    "ferrite-model-granite/cuda",
    "ferrite-model-llama/cuda",
    "ferrite-model-mistral/cuda",
    "ferrite-model-qwen2/cuda",
    "ferrite-model-qwen3/cuda",
]

[dependencies]
ferrite-model-commandr = { path = "../ferrite-model-commandr" }
ferrite-model-gemma2 = { path = "../ferrite-model-gemma2" }
ferrite-model-gemma3 = { path = "../ferrite-model-gemma3" }
ferrite-model-granite = { path = "../ferrite-model-granite" }
ferrite-model-llama = { path = "../ferrite-model-llama" }
ferrite-model-mistral = { path = "../ferrite-model-mistral" }
ferrite-model-qwen2 = { path = "../ferrite-model-qwen2" }
ferrite-model-qwen3 = { path = "../ferrite-model-qwen3" }
