[package]
name = "ferrite-models"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Ferrite model architectures using #[forward] macro"

[features]
default = ["all-arches"]

# Per-arch flags. Each one pulls in the corresponding ferrite-model-<arch>
# crate. The umbrella `all-arches` enables every arch.
arch-commandr      = ["dep:ferrite-model-commandr"]
arch-deepseek-v2   = ["dep:ferrite-model-deepseek-v2"]
arch-deepseek-v3   = ["dep:ferrite-model-deepseek-v3"]
arch-deepseek-v3-flat = ["dep:ferrite-model-deepseek-v3-flat"]
arch-gemma2        = ["dep:ferrite-model-gemma2"]
arch-gemma3        = ["dep:ferrite-model-gemma3"]
arch-gemma3-mm     = ["arch-gemma3", "dep:ferrite-model-gemma3-mm"]
arch-granite       = ["dep:ferrite-model-granite"]
arch-llama         = ["dep:ferrite-model-llama"]
arch-mistral       = ["dep:ferrite-model-mistral"]
arch-mixtral       = ["dep:ferrite-model-mixtral"]
arch-modernbert    = ["dep:ferrite-model-modernbert"]
arch-phi3          = ["dep:ferrite-model-phi3"]
arch-qwen2         = ["dep:ferrite-model-qwen2"]
arch-qwen2-moe     = ["dep:ferrite-model-qwen2-moe"]
arch-qwen2-vl      = ["arch-qwen2", "dep:ferrite-model-qwen2-vl"]
arch-qwen2-5-vl    = ["arch-qwen2", "dep:ferrite-model-qwen2-5-vl"]
arch-qwen3         = ["dep:ferrite-model-qwen3"]
arch-qwen3-moe     = ["dep:ferrite-model-qwen3-moe"]

all-arches = [
    "arch-commandr",
    "arch-deepseek-v2",
    "arch-deepseek-v3",
    "arch-deepseek-v3-flat",
    "arch-gemma2",
    "arch-gemma3",
    "arch-gemma3-mm",
    "arch-granite",
    "arch-llama",
    "arch-mistral",
    "arch-mixtral",
    "arch-modernbert",
    "arch-phi3",
    "arch-qwen2",
    "arch-qwen2-moe",
    "arch-qwen2-vl",
    "arch-qwen2-5-vl",
    "arch-qwen3",
    "arch-qwen3-moe",
]

# Apple Silicon metal backend. Forwards `metal` only to per-arch crates that
# have a verified metal `load()` path (post-Stage-E: llama / mistral / qwen3 /
# granite). Other crates' `metal` feature exists but their `load()` may
# `compile_error!` for unsupported scaling families (LongRoPE on phi3, etc.) —
# add them here as their loaders land.
#
# Unlike `cuda`, this feature *also* enables the arch-* features for each
# supported arch directly, so callers turning on `metal` don't need to
# additionally request `all-arches` (which would drag in arches whose macro
# expansion fails under metal).
metal = [
    "arch-llama",
    "arch-mistral",
    "arch-qwen3",
    "arch-granite",
    "ferrite-model-llama?/metal",
    "ferrite-model-mistral?/metal",
    "ferrite-model-qwen3?/metal",
    "ferrite-model-granite?/metal",
]

cuda = [
    # Enable every arch under cuda — mirrors the historical `default = ["all-arches"]`
    # behaviour. Callers that want a narrower cuda build can `default-features = false`
    # the ferrite-models dep and then opt into individual arch- features alongside cuda.
    "all-arches",
    "ferrite-model-commandr?/cuda",
    "ferrite-model-gemma2?/cuda",
    "ferrite-model-gemma3?/cuda",
    "ferrite-model-gemma3-mm?/cuda",
    "ferrite-model-granite?/cuda",
    "ferrite-model-llama?/cuda",
    "ferrite-model-mistral?/cuda",
    "ferrite-model-mixtral?/cuda",
    "ferrite-model-modernbert?/cuda",
    "ferrite-model-phi3?/cuda",
    "ferrite-model-qwen2?/cuda",
    "ferrite-model-qwen2-moe?/cuda",
    "ferrite-model-qwen2-vl?/cuda",
    "ferrite-model-qwen2-5-vl?/cuda",
    "ferrite-model-qwen3?/cuda",
    "ferrite-model-qwen3-moe?/cuda",
    "ferrite-model-deepseek-v2?/cuda",
    "ferrite-model-deepseek-v3?/cuda",
    "ferrite-model-deepseek-v3-flat?/cuda",
]

# Tensor-parallel umbrella. Forwards `nccl` through to every per-arch
# crate so a single `--features nccl` on this crate flips the whole
# tree onto the TP-aware build. Until task #7's compile() outer-loop
# fanout lands, this is purely additive — every per-arch macro
# expansion still emits a tp=1 single-rank module set.
nccl = [
    "cuda",
    "ferrite-model-commandr?/nccl",
    "ferrite-model-gemma2?/nccl",
    "ferrite-model-gemma3?/nccl",
    "ferrite-model-gemma3-mm?/nccl",
    "ferrite-model-granite?/nccl",
    "ferrite-model-llama?/nccl",
    "ferrite-model-mistral?/nccl",
    "ferrite-model-mixtral?/nccl",
    "ferrite-model-modernbert?/nccl",
    "ferrite-model-phi3?/nccl",
    "ferrite-model-qwen2?/nccl",
    "ferrite-model-qwen2-moe?/nccl",
    "ferrite-model-qwen2-vl?/nccl",
    "ferrite-model-qwen2-5-vl?/nccl",
    "ferrite-model-qwen3?/nccl",
    "ferrite-model-qwen3-moe?/nccl",
    "ferrite-model-deepseek-v2?/nccl",
    "ferrite-model-deepseek-v3?/nccl",
]

[dependencies]
ferrite-model-commandr     = { path = "../ferrite-model-commandr",     optional = true }
ferrite-model-deepseek-v2  = { path = "../ferrite-model-deepseek-v2",  optional = true }
ferrite-model-deepseek-v3  = { path = "../ferrite-model-deepseek-v3",  optional = true }
ferrite-model-deepseek-v3-flat = { path = "../ferrite-model-deepseek-v3-flat", optional = true }
ferrite-model-gemma2       = { path = "../ferrite-model-gemma2",       optional = true }
ferrite-model-gemma3       = { path = "../ferrite-model-gemma3",       optional = true }
ferrite-model-gemma3-mm    = { path = "../ferrite-model-gemma3-mm",    optional = true }
ferrite-model-granite      = { path = "../ferrite-model-granite",      optional = true }
ferrite-model-llama        = { path = "../ferrite-model-llama",        optional = true }
ferrite-model-mistral      = { path = "../ferrite-model-mistral",      optional = true }
ferrite-model-mixtral      = { path = "../ferrite-model-mixtral",      optional = true }
ferrite-model-modernbert   = { path = "../ferrite-model-modernbert",   optional = true }
ferrite-model-phi3         = { path = "../ferrite-model-phi3",         optional = true }
ferrite-model-qwen2        = { path = "../ferrite-model-qwen2",        optional = true }
ferrite-model-qwen2-moe    = { path = "../ferrite-model-qwen2-moe",    optional = true }
ferrite-model-qwen2-vl     = { path = "../ferrite-model-qwen2-vl",     optional = true }
ferrite-model-qwen2-5-vl   = { path = "../ferrite-model-qwen2-5-vl",   optional = true }
ferrite-model-qwen3        = { path = "../ferrite-model-qwen3",        optional = true }
ferrite-model-qwen3-moe    = { path = "../ferrite-model-qwen3-moe",    optional = true }
