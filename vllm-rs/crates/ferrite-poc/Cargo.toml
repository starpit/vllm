[package]
name = "ferrite-poc"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Ferrite Phase 0: proof-of-concept LLVM IR → PTX → GPU kernel pipeline"

[[bin]]
name = "ferrite-poc"
path = "src/main.rs"

[[bin]]
name = "ferrite-fuse-test"
path = "src/fuse_test.rs"

[[bin]]
name = "ferrite-fuse-bench"
path = "src/fuse_bench.rs"

[[bin]]
name = "ferrite-mlp-bench"
path = "src/mlp_bench.rs"

[dependencies]
# LLVM bindings — pick the feature matching your installed LLVM version.
# On Ubuntu: `apt install llvm-21-dev` then use llvm21-1.
# On macOS: `brew install llvm@21` then use llvm21-1.
# Set LLVM_SYS_211_PREFIX=/path/to/llvm if not auto-detected.
inkwell = { version = "0.8", features = ["llvm20-1", "llvm20-1-force-dynamic", "target-nvptx"] }

# CUDA driver API — we use nvrtc feature for Ptx type, but load raw PTX via driver API
cudarc = { workspace = true, features = ["nvrtc", "dynamic-linking", "cuda-version-from-build-system"] }

half = { workspace = true }
anyhow = { workspace = true }
llvm-sys = { version = "201", features = ["force-dynamic"] }

# Ferrite crates for proc-macro integration
ferrite-ptx = { path = "../ferrite-ptx" }
ferrite-macros = { path = "../ferrite-macros" }
ferrite-runtime = { path = "../ferrite-runtime" }
