[package]
name = "ferrite-vision"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Ferrite vision-tower host glue (rope tables, varlen cu_seqlens, patch flatten, K-pad, trace dump)."

[features]
default = []
cuda = ["ferrite-cuda-core/cuda", "ferrite-kernels/cuda"]
# Metal: only the pure-CPU host glue (rope tables, cu_seqlens, patch flatten)
# and the `MmMetadata` type compile — the GPU helpers (k_pad/dump_tensor) stay
# `#[cfg(feature = "cuda")]`. Brings the backend deps in with their metal
# feature so `ferrite-kernels` (which needs a backend) builds.
metal = ["ferrite-cuda-core/metal", "ferrite-kernels/metal"]
nccl = ["cuda", "ferrite-cuda-core/nccl", "ferrite-kernels/nccl"]

[dependencies]
ferrite-cuda-core = { path = "../ferrite-cuda-core" }
ferrite-kernels = { path = "../ferrite-kernels" }
vllm-common = { path = "../vllm-common" }
anyhow = { workspace = true }
half = { workspace = true }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
