[package]
name = "ferrite-wavefront"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]

[features]
default = []
# `cuda` enables the FFI binding to the orchestrator's emitted
# `launch_<name>` C-linkage host wrapper. Linking is done by this
# crate's `build.rs`, which emits `rustc-link-lib=static=megakernels`
# pointing at the cudaforge cache `ferrite-cuda-builder` populates.
# We can't depend on `ferrite-cuda-builder` directly here — it would
# create a cycle through `ferrite-models -> ferrite-forward -> us`.
# Build ordering is enforced by the top-level binary that uses both
# crates.
cuda = ["dep:cudarc"]

[dependencies]
dirs = "6"
# cudarc is the safe wrapper we use in the `cuda`-feature smoke test
# (and any future production launcher caller) to allocate device
# buffers and obtain a `cudaStream_t` to hand the orchestrator's
# `launch_<name>` wrapper. The version is pinned to the workspace's
# candle-core requirement so we link against the same FFI layer.
cudarc = { workspace = true, optional = true, features = ["dynamic-linking", "cuda-version-from-build-system"] }

[build-dependencies]
dirs = "6"

[dev-dependencies]
# `cpu_golden` is the host calculator the VALIDATION tests compute with
# (test-only — no non-test code references ferrite-forward). It lives in
# dev-dependencies so this crate's normal graph has NO edge to
# ferrite-forward: that lets `ferrite-forward` depend on this crate (the
# GPU subtile Executor lives in its metal interpreter and consumes
# `metal_tape`) without a cycle. Cargo permits the dev-only back-edge.
# ferrite-forward builds backend-agnostic here (no cuda/metal feature),
# so the tests stay host-runnable on any platform.
ferrite-forward = { path = "../ferrite-forward" }
# `half::bf16` for the dev-side bf16 round-trip in the
# `*_kernel_matches_cpu_golden` validation tests — the kernel reads
# bf16 from HBM, so the host reference must apply the same lossy
# conversion to compare on equal terms.
half = { workspace = true }
