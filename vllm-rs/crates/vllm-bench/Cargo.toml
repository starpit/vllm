[package]
name = "vllm-bench"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Benchmarking tools for vLLM Rust inference engine"

[features]
default = []
cuda = ["vllm-serve/cuda"]
metal = ["vllm-serve/metal"]

[dependencies]
vllm-common = { workspace = true }
vllm-config = { workspace = true }
vllm-serve = { workspace = true }
clap = { workspace = true }
tokio = { workspace = true }
anyhow = { workspace = true }
serde_json = { workspace = true }
indicatif = { workspace = true }
reqwest = { workspace = true, features = ["blocking"] }
futures-util = { workspace = true }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
tokenizers = { workspace = true }
hf-hub = { workspace = true }
rand = { workspace = true }
rand_distr = "0.4"
serde = { workspace = true }
shell-words = "1"
url = "2"
csv = "1"
dirs = "5"
parquet = { version = "58", default-features = false, features = ["arrow", "snap"] }
arrow = { version = "58", default-features = false, features = ["json"] }
