[package]
name = "vllm-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "CLI binary for vLLM Rust inference engine"

[features]
default = ["bench", "guided-decoding", "chat-template", "metrics", "multimodal", "tls"]
bench = ["vllm-bench"]
cuda = ["vllm-serve/cuda", "vllm-executor/cuda", "vllm-kernels/cuda", "vllm-models/cuda", "vllm-bench?/cuda"]
cuda-backend = ["vllm-serve/cuda-backend", "vllm-executor/cuda-backend"]
nccl = ["cuda", "vllm-serve/nccl", "vllm-kernels/nccl"]
profiling = ["cuda", "vllm-serve/profiling", "vllm-executor/profiling", "vllm-models/profiling", "vllm-kernels/profiling", "vllm-bench?/profiling"]
metal = ["vllm-serve/metal", "vllm-mlx", "vllm-bench?/metal"]
wgpu = ["vllm-serve/wgpu"]
candle-metal = ["vllm-executor/metal", "vllm-kernels/metal", "vllm-models/metal"]
guided-decoding = ["vllm-serve/guided-decoding"]
multimodal = ["vllm-serve/multimodal"]
chat-template = ["vllm-serve/chat-template"]
tls = ["vllm-serve/tls"]
metrics = ["vllm-serve/metrics"]
multiproc = ["vllm-serve/multiproc"]
top = ["ratatui", "crossterm", "tokio-stream", "vllm-serve/top"]

[[bin]]
name = "vllm"
path = "src/main.rs"

[dependencies]
vllm-common = { workspace = true }
vllm-config = { workspace = true }
vllm-serve = { workspace = true }
vllm-executor = { workspace = true }
vllm-models = { workspace = true }
vllm-kernels = { workspace = true }
vllm-mlx = { workspace = true, optional = true }
vllm-bench = { workspace = true, optional = true }
clap = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { version = "1", features = ["v4"] }
libc = { workspace = true }
core-foundation = { workspace = true }
ratatui = { workspace = true, optional = true }
crossterm = { workspace = true, optional = true }
reqwest = { workspace = true }
futures-util = { workspace = true }
tokio-stream = { workspace = true, optional = true }

[dev-dependencies]
tempfile = { workspace = true }
