[package]
name = "vllm-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "CLI binary for vLLM Rust inference engine"

[features]
default = ["guided-decoding", "metrics", "multimodal"]
otel = ["vllm-serve/otel"]
gce = ["vllm-gce"]
k8s = ["vllm-k8s"]
bench = ["vllm-bench"]
cuda = ["vllm-serve/cuda", "vllm-executor/cuda", "vllm-bench?/cuda", "dep:ferrite-forward", "ferrite-forward/cuda", "dep:ferrite-cuda-targets"]
nccl = ["cuda", "vllm-cuda/nccl", "vllm-serve/nccl", "vllm-executor/nccl"]
profiling = ["cuda"]
metal = ["vllm-serve/metal", "vllm-mlx", "vllm-bench?/metal"]
wgpu = ["vllm-serve/wgpu"]
guided-decoding = ["vllm-serve/guided-decoding"]
multimodal = ["vllm-serve/multimodal"]
tls = ["vllm-serve/tls"]
metrics = ["vllm-serve/metrics"]
multiproc = ["vllm-serve/multiproc"]
top = ["ratatui", "crossterm", "tokio-stream", "vllm-serve/top"]
rag = ["vllm-serve/rag"]

[[bin]]
name = "vllm"
path = "src/main.rs"

[dependencies]
vllm-common = { workspace = true }
vllm-config = { workspace = true }
vllm-serve = { workspace = true }
vllm-executor = { workspace = true }
vllm-model = { workspace = true }
vllm-cuda = { workspace = true }
ferrite-forward = { path = "../ferrite-forward", optional = true }
ferrite-cuda-targets = { path = "../ferrite-cuda-targets", optional = true }
vllm-gce = { workspace = true, optional = true }
vllm-k8s = { workspace = true, optional = true }
vllm-mlx = { workspace = true, optional = true }
vllm-bench = { workspace = true, optional = true }
chrono = "0.4"
clap = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
anyhow = { workspace = true }
dotenvy = { workspace = true }
hf-hub = { workspace = true }
indicatif = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { version = "1", features = ["v4"] }
libc = { workspace = true }
core-foundation = { workspace = true }
ratatui = { workspace = true, optional = true }
crossterm = { workspace = true, optional = true }
reqwest = { workspace = true }
futures-util = { workspace = true }
tokio-stream = { workspace = true, optional = true }

[dev-dependencies]
tempfile = { workspace = true }
