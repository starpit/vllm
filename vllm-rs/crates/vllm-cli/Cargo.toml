[package]
name = "vllm-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "CLI binary for vLLM Rust inference engine"

[features]
default = []
cuda = ["vllm-serve/cuda", "vllm-executor/cuda", "vllm-kernels/cuda", "vllm-models/cuda"]
metal = ["vllm-serve/metal", "vllm-mlx"]
candle-metal = ["vllm-executor/metal", "vllm-kernels/metal", "vllm-models/metal"]

[[bin]]
name = "vllm"
path = "src/main.rs"

[dependencies]
vllm-common = { workspace = true }
vllm-core = { workspace = true }
vllm-serve = { workspace = true }
vllm-executor = { workspace = true }
vllm-models = { workspace = true }
vllm-kernels = { workspace = true }
vllm-mlx = { workspace = true, optional = true }
clap = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
anyhow = { workspace = true }
serde_json = { workspace = true }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = { workspace = true }
