[package]
name = "vllm-cuda"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Purpose-built CUDA tensor runtime for LLM inference — replaces candle on GPU"

[features]
default = []
# Enable CUDA runtime. Requires CUDA toolkit + nvcc.
cuda = ["dep:cudarc", "dep:ferrite-cuda-builder", "ferrite-cuda-builder/cuda", "dep:hf-hub", "ferrite-cuda-core/cuda", "ferrite-kernels/cuda", "ferrite-models/cuda"]
# Enable NCCL multi-GPU collective communication (requires libnccl).
nccl = ["cuda", "cudarc/nccl", "ferrite-cuda-core/nccl", "ferrite-kernels/nccl"]
# Enable NVTX profiling annotations for nsys/Nsight traces.
profiling = ["cuda", "cudarc/nvtx"]

[dependencies]
cudarc = { workspace = true, optional = true, features = ["cublas", "cublaslt", "dynamic-linking", "cuda-version-from-build-system"] }
ferrite-cuda-builder = { path = "../ferrite-cuda-builder", optional = true }
ferrite-cuda-core = { path = "../ferrite-cuda-core" }
ferrite-kernels = { path = "../ferrite-kernels" }
ferrite-models = { path = "../ferrite-models" }
half = { workspace = true }
safetensors = { workspace = true }
memmap2 = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
vllm-common = { path = "../vllm-common" }
vllm-config = { path = "../vllm-config" }
vllm-model = { path = "../vllm-model" }
libc = { workspace = true }
hf-hub = { version = "0.4", optional = true }

[build-dependencies]
dirs = "6"

[dev-dependencies]
rand = { workspace = true }
tempfile = { workspace = true }
portpicker = "0.1"
hf-hub = "0.4"
