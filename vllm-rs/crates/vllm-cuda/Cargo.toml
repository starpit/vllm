[package]
name = "vllm-cuda"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Purpose-built CUDA tensor runtime for LLM inference — replaces candle on GPU"

[features]
default = []
# Enable CUDA runtime. Requires CUDA toolkit + nvcc.
cuda = ["dep:cudarc", "dep:vllm-kernels-cuda", "vllm-kernels-cuda/cuda", "dep:hf-hub"]
# Enable NCCL multi-GPU collective communication (requires libnccl).
nccl = ["cuda", "cudarc/nccl"]
# Enable NVTX profiling annotations for nsys/Nsight traces.
profiling = ["cuda", "cudarc/nvtx"]

[dependencies]
cudarc = { workspace = true, optional = true, features = ["cublas", "cublaslt", "dynamic-linking", "cuda-version-from-build-system"] }
vllm-kernels-cuda = { path = "../vllm-kernels-cuda", optional = true }
half = { workspace = true }
safetensors = { workspace = true }
memmap2 = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
vllm-common = { path = "../vllm-common" }
vllm-config = { path = "../vllm-config" }
vllm-model = { path = "../vllm-model" }
vllm-tk-macros = { path = "../vllm-tk-macros" }
libc = { workspace = true }
hf-hub = { version = "0.4", optional = true }

[build-dependencies]
dirs = "6"

[dev-dependencies]
rand = { workspace = true }
tempfile = { workspace = true }
portpicker = "0.1"
hf-hub = "0.4"
