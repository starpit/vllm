[package]
name = "vllm-e2e"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "End-to-end tests for vLLM Rust inference engine"

[features]
default = ["guided-decoding", "metrics", "multimodal", "tls"]
e2e = []
otel = ["vllm-serve/otel", "vllm-common/otel"]
cuda = ["vllm-serve/cuda"]
nccl = ["cuda"]
metal = ["vllm-serve/metal"]
rag = ["vllm-serve/rag", "dep:spnl-core"]
guided-decoding = ["vllm-serve/guided-decoding"]
multimodal = ["vllm-serve/multimodal"]
tls = ["vllm-serve/tls"]
metrics = ["vllm-serve/metrics"]
multiproc = ["vllm-serve/multiproc"]

[dependencies]
# HTTP client
reqwest = { workspace = true }

# Async runtime
tokio = { workspace = true }

# Serialization (reuse protocol types from vllm-serve)
serde = { workspace = true }
serde_json = { workspace = true }

# Error handling
anyhow = { workspace = true }

# UUID generation (for batch IDs in tests)
uuid = { version = "1", features = ["v4"] }

# Logging
tracing = { workspace = true }

# Server stack (in-process startup)
vllm-common = { workspace = true }
vllm-serve = { workspace = true }
spnl-core = { workspace = true, optional = true, features = ["rag"] }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util", "macros"] }
safetensors = { workspace = true }
half = { workspace = true }
tempfile = { workspace = true }
