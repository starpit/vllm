[package]
name = "vllm-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Engine core loop and request lifecycle for vLLM Rust port"

[features]
default = []
multiproc = ["vllm-protocol/multiproc"]

[dependencies]
vllm-common = { workspace = true }
vllm-config = { workspace = true }
vllm-core = { workspace = true }
vllm-protocol = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
bytes = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
