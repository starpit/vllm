[package]
name = "vllm-examples"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Example applications for vLLM-rs — includes WebGPU in-browser chat and native demos"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
vllm-wgpu = { path = "../vllm-wgpu" }
serde = { workspace = true }
serde_json = { workspace = true }
tracing.workspace = true
tokenizers = { version = "0.22", default-features = false, features = ["unstable_wasm"] }

# WASM deps (used by lib.rs wasm_bindgen exports)
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = [
    "console",
    "CssStyleDeclaration",
    "Document",
    "Element",
    "EventTarget",
    "HtmlElement",
    "HtmlInputElement",
    "HtmlTextAreaElement",
    "HtmlSelectElement",
    "HtmlButtonElement",
    "KeyboardEvent",
    "Window",
    "Performance",
    "Headers",
    "Request",
    "RequestInit",
    "RequestMode",
    "Response",
    "ReadableStream",
    "ReadableStreamDefaultReader",
] }
js-sys = "0.3"
serde-wasm-bindgen = "0.6"

[dev-dependencies]
pollster = "0.4"
tokio = { workspace = true, features = ["rt", "macros"] }
tokenizers.workspace = true
vllm-model = { path = "../vllm-model" }
ferrite-gguf = { path = "../ferrite-gguf" }
anyhow = { workspace = true }

[[example]]
name = "native_chat"
path = "examples/native_chat.rs"

[[example]]
name = "gguf_tok_dump"
path = "examples/gguf_tok_dump.rs"
