[package]
name = "vllm-examples"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Example applications for vLLM-rs — includes WebGPU in-browser chat and native demos"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
vllm-wgpu = { path = "../vllm-wgpu" }
serde = { workspace = true }
serde_json = { workspace = true }
tracing.workspace = true

# WASM deps (used by lib.rs wasm_bindgen exports)
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = [
    "console",
    "Document",
    "Element",
    "HtmlElement",
    "Window",
    "Performance",
    "Headers",
    "Request",
    "RequestInit",
    "RequestMode",
    "Response",
] }
js-sys = "0.3"
serde-wasm-bindgen = "0.6"

[dev-dependencies]
pollster = "0.4"
tokio = { workspace = true, features = ["rt", "macros"] }
tokenizers.workspace = true

[[example]]
name = "native_chat"
path = "examples/native_chat.rs"
