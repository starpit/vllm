[package]
name = "vllm-executor"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Worker/process management and distributed coordination for vLLM Rust port"

[features]
default = []
cuda = [
    "vllm-cuda/cuda",
    "cudarc",
    "dep:ferrite-forward",
    "dep:ferrite-models",
    "dep:ferrite-cuda-core",
    "dep:ferrite-kernels",
    "ferrite-forward/cuda",
    "ferrite-models/cuda",
    "ferrite-cuda-core/cuda",
    "ferrite-kernels/cuda",
]
metal = [
    "dep:ferrite-forward",
    "dep:ferrite-models",
    "dep:ferrite-cuda-core",
    "dep:ferrite-kernels",
    "dep:ferrite-metal-kernels",
    "dep:objc2",
    "dep:objc2-metal",
    "dep:objc2-foundation",
    "ferrite-forward/metal",
    "ferrite-models/metal",
    "ferrite-cuda-core/metal",
    "ferrite-kernels/metal",
]
nccl = ["cuda", "vllm-cuda/nccl", "ferrite-forward/nccl", "ferrite-cuda-core/nccl", "ferrite-models/nccl"]
guided-decoding = ["vllm-model/guided-decoding"]

[dependencies]
vllm-common = { workspace = true }
vllm-config = { workspace = true }
vllm-core = { workspace = true }
vllm-engine = { workspace = true }
vllm-model = { workspace = true }
ferrite-gguf = { workspace = true }
vllm-cuda = { workspace = true, optional = true }
ferrite-forward = { path = "../ferrite-forward", optional = true }
ferrite-models = { path = "../ferrite-models", optional = true }
ferrite-cuda-core = { path = "../ferrite-cuda-core", optional = true }
ferrite-kernels = { path = "../ferrite-kernels", optional = true }
ferrite-metal-kernels = { path = "../ferrite-metal-kernels", optional = true }
objc2 = { version = "0.6", optional = true }
objc2-metal = { version = "0.3", optional = true }
objc2-foundation = { version = "0.3", optional = true }
half = { workspace = true }
tokenizers = { workspace = true }
hf-hub = { workspace = true }
indicatif = { workspace = true }
tokio = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
libc = { workspace = true }
cudarc = { workspace = true, optional = true }
rand = { workspace = true }
bincode = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
serde_json = { workspace = true }
tempfile = { workspace = true }
safetensors = { workspace = true }
