[package]
name = "vllm-executor"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Worker/process management and distributed coordination for vLLM Rust port"

[features]
default = []
cuda = ["vllm-cuda/cuda", "cudarc"]
nccl = ["cuda", "vllm-cuda/nccl"]
guided-decoding = ["vllm-models/guided-decoding"]

[dependencies]
vllm-common = { workspace = true }
vllm-config = { workspace = true }
vllm-core = { workspace = true }
vllm-engine = { workspace = true }
vllm-model = { workspace = true }
vllm-models = { workspace = true }
vllm-cuda = { workspace = true, optional = true }
candle-core = { workspace = true }
half = { workspace = true }
tokenizers = { workspace = true }
hf-hub = { workspace = true }
indicatif = { workspace = true }
tokio = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
libc = { workspace = true }
cudarc = { workspace = true, optional = true }
rand = { workspace = true }
bincode = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
serde_json = { workspace = true }
tempfile = { workspace = true }
safetensors = { workspace = true }
