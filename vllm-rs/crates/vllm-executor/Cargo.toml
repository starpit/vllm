[package]
name = "vllm-executor"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Worker/process management and distributed coordination for vLLM Rust port"

[features]
default = []
cuda = [
    "vllm-cuda/cuda",
    "cudarc",
    "dep:ferrite-forward",
    "dep:ferrite-models",
    "dep:ferrite-cuda-core",
    "ferrite-forward/cuda",
    "ferrite-models/cuda",
    "ferrite-cuda-core/cuda",
]
nccl = ["cuda", "vllm-cuda/nccl"]
guided-decoding = ["vllm-model/guided-decoding"]

[dependencies]
vllm-common = { workspace = true }
vllm-config = { workspace = true }
vllm-core = { workspace = true }
vllm-engine = { workspace = true }
vllm-model = { workspace = true }
vllm-cuda = { workspace = true, optional = true }
ferrite-forward = { path = "../ferrite-forward", optional = true }
ferrite-models = { path = "../ferrite-models", optional = true }
ferrite-cuda-core = { path = "../ferrite-cuda-core", optional = true }
half = { workspace = true }
tokenizers = { workspace = true }
hf-hub = { workspace = true }
indicatif = { workspace = true }
tokio = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
libc = { workspace = true }
cudarc = { workspace = true, optional = true }
rand = { workspace = true }
bincode = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
serde_json = { workspace = true }
tempfile = { workspace = true }
safetensors = { workspace = true }
