[package]
name = "vllm-gce"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "GCE VM provisioning for vLLM (Compute API + SSH tunnel)"

[dependencies]
anyhow = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
google-cloud-compute-v1 = { version = "2.1", features = ["instances"] }
google-cloud-lro = "1.3"
russh = "0.57"
russh-keys = "0.49"
uuid = { version = "1", features = ["v4"] }
indicatif = { workspace = true }
flate2 = "1"
tar = "0.4"
walkdir = "2"
ignore = "0.4"
futures = "0.3"
