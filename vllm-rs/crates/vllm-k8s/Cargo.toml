[package]
name = "vllm-k8s"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Kubernetes deployment for vLLM (StatefulSet + headless Service for TP)"

[dependencies]
anyhow = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
indicatif = { workspace = true }
uuid = { version = "1", features = ["v4"] }
futures = "0.3"
tokio-stream = { version = "0.1", features = ["net"] }
kube = { version = "3.0.0", default-features = false, features = ["client", "runtime", "rustls-tls", "ring", "ws"] }
k8s-openapi = { version = "0.27.0", features = ["latest"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }

[dev-dependencies]
tower-test = "0.4"
