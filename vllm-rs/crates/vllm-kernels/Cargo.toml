[package]
name = "vllm-kernels"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "FFI bindings to CUDA/C++ kernels for vLLM Rust port"

[features]
default = []
# Enable CUDA kernel compilation and FFI bindings.
# Requires nvcc and CUDA toolkit.
cuda = []
# Enable Metal GPU compute on Apple Silicon.
metal = ["candle-core/metal"]

[dependencies]
vllm-common = { workspace = true }
vllm-model = { workspace = true }
candle-core = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }

[build-dependencies]
# Uncomment when building with CUDA:
# cc = "1"
# bindgen = "0.71"

[dev-dependencies]
rand = { workspace = true }
