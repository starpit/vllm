[package]
name = "vllm-kernels"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "FFI bindings to CUDA/C++ kernels for vLLM Rust port"

[features]
default = []
# Enable CUDA kernel compilation and FFI bindings.
# Requires nvcc and CUDA toolkit.
cuda = ["candle-core/cuda", "cudarc", "cc"]
# Enable NCCL multi-GPU collective communication (requires libnccl).
nccl = ["cuda", "cudarc/nccl"]
# Enable Metal GPU compute on Apple Silicon.
metal = ["candle-core/metal"]

[dependencies]
vllm-common = { workspace = true }
vllm-model = { workspace = true }
candle-core = { workspace = true }
cudarc = { workspace = true, optional = true }
half = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }

[build-dependencies]
cc = { version = "1", optional = true }

[dev-dependencies]
rand = { workspace = true }
