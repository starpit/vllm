[package]
name = "vllm-mlx"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "MLX backend for Apple Silicon GPU acceleration in vLLM Rust port"

[features]
default = ["mlx"]
mlx = ["mlx-rs"]
guided-decoding = ["vllm-model/guided-decoding"]

[dependencies]
vllm-common = { workspace = true }
vllm-config = { workspace = true }
vllm-core = { workspace = true }
vllm-engine = { workspace = true }
vllm-executor = { workspace = true }
vllm-model = { workspace = true }
mlx-rs = { workspace = true, optional = true }
tokenizers = { workspace = true }
tracing = { workspace = true }
hf-hub = { workspace = true }
indicatif = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
rand = { workspace = true }
libc = { workspace = true }

[build-dependencies]
cc = "1"
# build.rs scans for mlx-sys build output to find MLX headers. Must be a
# build-dep (not just transitive via mlx-rs) so Cargo guarantees it's fully
# built before build.rs runs. Without this, clean builds race and fail with
# "mlx/mlx.h not found".
mlx-sys = "0.2"

[dev-dependencies]
tempfile = { workspace = true }
