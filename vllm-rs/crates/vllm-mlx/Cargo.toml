[package]
name = "vllm-mlx"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "MLX backend for Apple Silicon GPU acceleration in vLLM Rust port"

[features]
default = ["mlx"]
mlx = ["mlx-rs"]
guided-decoding = ["outlines-core", "vllm-models/guided-decoding"]

[dependencies]
vllm-common = { workspace = true }
vllm-config = { workspace = true }
vllm-core = { workspace = true }
vllm-engine = { workspace = true }
vllm-executor = { workspace = true }
vllm-model = { workspace = true }
vllm-models = { workspace = true }
mlx-rs = { workspace = true, optional = true }
outlines-core = { workspace = true, optional = true }
tokenizers = { workspace = true }
tracing = { workspace = true }
hf-hub = { workspace = true }
indicatif = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
rand = { workspace = true }
sysinfo = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
