[package]
name = "vllm-model"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Model loading, weight management, and tensor abstractions for vLLM Rust port"

[features]
default = []
multimodal = ["image"]
guided-decoding = ["llguidance", "toktrie", "toktrie_hf_tokenizers"]

[dependencies]
vllm-common = { workspace = true }
vllm-config = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
byteorder = { workspace = true }
rand = { workspace = true }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"], optional = true }
llguidance = { workspace = true, optional = true }
toktrie = { workspace = true, optional = true }
toktrie_hf_tokenizers = { workspace = true, optional = true }

[dev-dependencies]
tempfile = { workspace = true }
safetensors = { workspace = true }
