[package]
name = "vllm-models"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Shared model infrastructure: sampler, attention metadata, KV cache, embeddings"

[features]
default = []
guided-decoding = ["llguidance", "toktrie", "toktrie_hf_tokenizers"]

[dependencies]
vllm-common = { workspace = true }
vllm-model = { workspace = true }
candle-core = { workspace = true }
llguidance = { workspace = true, optional = true }
toktrie = { workspace = true, optional = true }
toktrie_hf_tokenizers = { workspace = true, optional = true }
thiserror = { workspace = true }
rand = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
safetensors = { workspace = true }
serde_json = { workspace = true }
