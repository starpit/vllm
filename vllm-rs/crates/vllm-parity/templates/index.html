<script>
const ROWS = /*__PARITY_ROWS__*/;
const SUMMARIES = /*__PARITY_SUMMARIES__*/;
const BENCH = /*__BENCH_DATA__*/;

// ---- Routing ----
function route() {
  const hash = location.hash || '#/';
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.nav-bar a').forEach(a => a.classList.remove('active'));
  if (hash === '#/parity') {
    document.getElementById('page-parity').classList.add('active');
    document.querySelector('[data-page="parity"]').classList.add('active');
  } else {
    document.getElementById('page-main').classList.add('active');
    document.querySelector('[data-page="main"]').classList.add('active');
  }
}
window.addEventListener('hashchange', route);
route();

// ---- Overall summary ----
function renderOverall() {
  let yes = 0, partial = 0, no = 0;
  for (const s of Object.values(SUMMARIES)) { yes += s.yes; partial += s.partial; no += s.no; }
  const total = yes + partial + no;
  const pct = (total > 0) ? ((yes + partial * 0.5) / total * 100).toFixed(0) : 0;
  const pctYes = (yes / total * 100).toFixed(1);
  const pctPartial = (partial / total * 100).toFixed(1);
  const pctNo = (no / total * 100).toFixed(1);
  document.getElementById('overall-summary').innerHTML = `
    <div class="overall-bar">
      <div class="overall-pct">
        <div class="num">${pct}%</div>
        <div class="label">Function Parity</div>
      </div>
      <div class="overall-detail">
        <div class="progress-bar">
          <div class="seg-yes" style="width:${pctYes}%"></div>
          <div class="seg-partial" style="width:${pctPartial}%"></div>
          <div class="seg-no" style="width:${pctNo}%"></div>
        </div>
        <div class="overall-stats">
          <span><span class="dot dot-yes"></span> <strong>${yes}</strong> implemented</span>
          <span><span class="dot dot-partial"></span> <strong>${partial}</strong> partial</span>
          <span><span class="dot dot-no"></span> <strong>${no}</strong> not yet</span>
          <span style="color:var(--text-dim)">${total} total features tracked</span>
        </div>
      </div>
    </div>`;
}
renderOverall();

// ---- Summary grid ----
// Group ROWS by section, preserving order
const ROWS_BY_SECTION = {};
for (const row of ROWS) {
  if (!ROWS_BY_SECTION[row.section]) ROWS_BY_SECTION[row.section] = [];
  ROWS_BY_SECTION[row.section].push(row);
}

function statusClass(row) {
  const dep = (row.deprecated||'').trim().toLowerCase();
  if (dep === 'yes') return 'st-deprecated';
  if (dep === 'wontfix') return 'st-wontfix';
  const v = (row.rust||'').trim();
  if (v === 'yes') return 'st-yes';
  if (v === 'partial') return 'st-partial';
  if (v === 'no' || v === '') return 'st-no';
  return 'st-na';
}

function statusLabel(row) {
  const dep = (row.deprecated||'').trim().toLowerCase();
  if (dep === 'yes') return 'Deprecated Feature';
  if (dep === 'wontfix') return "Won't Fix";
  const v = (row.rust||'').trim();
  if (v === 'yes') return 'Implemented';
  if (v === 'partial') return 'Partial';
  if (v === 'no' || v === '') return 'Not implemented';
  if (v === 'na') return 'N/A';
  return v;
}

const tooltip = document.getElementById('sg-tooltip');
let tooltipTimer = null;

function statusColor(row) {
  const dep = (row.deprecated||'').trim().toLowerCase();
  if (dep === 'yes') return 'repeating-linear-gradient(-45deg, var(--text-dim) 0px, var(--text-dim) 2px, var(--text-muted) 2px, var(--text-muted) 4px)';
  if (dep === 'wontfix') return 'repeating-linear-gradient(45deg, var(--text-dim) 0px, var(--text-dim) 2px, var(--text-muted) 2px, var(--text-muted) 4px)';
  const v = (row.rust||'').trim();
  if (v === 'yes') return 'var(--green)';
  if (v === 'partial') return 'var(--yellow)';
  return 'var(--red)';
}

function showTooltip(e, row) {
  clearTimeout(tooltipTimer);
  const tt = tooltip;
  const dot = tt.querySelector('.tt-dot');
  dot.style.background = statusColor(row);
  tt.querySelector('.tt-status-label').textContent = statusLabel(row) + (row.python === 'na' ? ' (Rust-only)' : '');
  tt.querySelector('.tt-feature').textContent = row.feature;
  tt.querySelector('.tt-notes').textContent = row.notes || '';
  tt.classList.add('visible');
  const x = Math.min(e.clientX + 12, window.innerWidth - 340);
  const y = e.clientY + 16;
  tt.style.left = x + 'px';
  tt.style.top = y + 'px';
}

function hideTooltip() {
  tooltipTimer = setTimeout(() => tooltip.classList.remove('visible'), 100);
}

function renderSummary() {
  const grid = document.getElementById('summary-grid');
  let trs = '';
  for (const [section, features] of Object.entries(ROWS_BY_SECTION)) {
    const esc = section.replace(/'/g, "\\'");
    let cells = '';
    const done = features.every(r => { const dep = (r.deprecated||'').trim().toLowerCase(); return (r.rust||'').trim() === 'yes' || dep === 'yes' || dep === 'wontfix'; });
    features.forEach((row, i) => {
      const cls = statusClass(row);
      cells += `<div class="sg-cell ${cls}" data-section="${section}" data-idx="${i}"></div>`;
    });
    const nameStyle = done ? ' style="text-decoration:line-through;opacity:0.7"' : '';
    const check = done ? '<span style="color:var(--green);font-size:1.1rem">&#10003;</span>' : '';
    trs += `<tr>
      <td class="sg-done">${check}</td>
      <td class="sg-name"${nameStyle} onclick="location.hash='#/parity';setTimeout(()=>highlightSection('${esc}'),100)">${section}</td>
      <td class="sg-cells"><div class="sg-cell-row">${cells}</div></td>
    </tr>`;
  }
  grid.innerHTML = `<table class="summary-grid-table">
    <thead><tr><th style="width:2rem"></th><th>Functional Area</th><th>Features</th></tr></thead>
    <tbody>${trs}</tbody>
  </table>`;

  // Attach tooltip events
  grid.querySelectorAll('.sg-cell').forEach(el => {
    const section = el.dataset.section;
    const idx = parseInt(el.dataset.idx);
    const row = ROWS_BY_SECTION[section][idx];
    el.addEventListener('mouseenter', e => showTooltip(e, row));
    el.addEventListener('mousemove', e => showTooltip(e, row));
    el.addEventListener('mouseleave', hideTooltip);
    el.addEventListener('click', e => {
      e.stopPropagation();
      location.hash = '#/parity';
      setTimeout(() => {
        highlightSection(section);
        // Try to highlight specific row
        const tables = document.querySelectorAll(`[data-section="${section}"] table tbody tr`);
        if (tables[idx]) {
          tables[idx].scrollIntoView({ behavior: 'smooth', block: 'center' });
          tables[idx].style.background = 'var(--accent-glow)';
          setTimeout(() => tables[idx].style.background = '', 2000);
        }
      }, 150);
    });
  });
}

// ---- Performance heatmaps (SVG) ----

// BrBG 9-stop diverging: brown (Rust slower) -> white -> teal (Rust faster)
    //const BRBG = ['#8c510a','#bf812d','#dfc27d','#f6e8c3','#f5f5f5','#c7eae5','#80cdc1','#35978f','#01665e'];
    const BRBG = ['#d73027',
'#f46d43',
'#fdae61',
'#fee08b',
'#ffffbf',
'#d9ef8b',
'#a6d96a',
'#66bd63',
'#1a9850'];
// Sequential blue for absolute serve metrics
const SEQ = ['#1e1e2e','#2d4a7a','#3b7dd8','#64b5f6','#e1f5fe'];

// "Qwen_Qwen2.5-3B-Instruct" -> "Qwen2.5-3B-Instruct"
function modelLabel(key) {
  const i = key.indexOf('_');
  return i >= 0 ? key.slice(i + 1) : key;
}

function modelSortKey(key) {
  const m = key.match(/(\d+)B/i);
  return m ? parseInt(m[1]) : 0;
}

function parseHex(hex) {
  return [parseInt(hex.slice(1,3),16), parseInt(hex.slice(3,5),16), parseInt(hex.slice(5,7),16)];
}

function lerpColor(stops, t) {
  t = Math.max(0, Math.min(1, t));
  const n = stops.length - 1;
  const i = Math.min(Math.floor(t * n), n - 1);
  const f = t * n - i;
  const a = parseHex(stops[i]), b = parseHex(stops[i + 1]);
  const r = Math.round(a[0] + (b[0]-a[0])*f);
  const g = Math.round(a[1] + (b[1]-a[1])*f);
  const bl = Math.round(a[2] + (b[2]-a[2])*f);
  return `rgb(${r},${g},${bl})`;
}

// Returns black or white depending on background luminance
function textColor(bgHex) {
  const [r,g,b] = typeof bgHex === 'string' && bgHex.startsWith('#') ? parseHex(bgHex) :
    bgHex.match(/\d+/g).map(Number);
  return (r*0.299 + g*0.587 + b*0.114) > 150 ? '#111' : '#fff';
}

// Build a Δ% grid from a combined rows array (both engines), filtered by block_size.
function buildDeltaGrid(rows, field, blockSize) {
  const pyIdx = {}, rsIdx = {};
  for (const r of rows) {
    if (blockSize !== null && String(r.block_size) !== String(blockSize)) continue;
    const key = `${r.input_len},${r.output_len}`;
    const v = typeof r[field] === 'number' ? r[field] : null;
    if (r.engine === 'python' && v !== null) pyIdx[key] = v;
    else if (r.engine === 'rust' && v !== null) rsIdx[key] = v;
  }
  const ils = [...new Set(Object.keys(rsIdx).map(k => +k.split(',')[0]))].sort((a,b) => a-b);
  const ols = [...new Set(Object.keys(rsIdx).map(k => +k.split(',')[1]))].sort((a,b) => a-b);
  const grid = ils.map(il => ols.map(ol => {
    const key = `${il},${ol}`;
    const pv = pyIdx[key], rv = rsIdx[key];
    return (pv !== undefined && rv !== undefined && pv !== 0)
      ? +((rv - pv) / pv * 100).toFixed(2) : null;
  }));
  return { input_lens: ils, output_lens: ols, grid };
}

// Build an absolute value grid from rust rows only.
function buildAbsGrid(rows, field) {
  const idx = {};
  for (const r of rows) {
    if (r.engine !== 'rust') continue;
    const v = typeof r[field] === 'number' ? r[field] : null;
    if (v !== null) idx[`${r.input_len},${r.output_len}`] = v;
  }
  const keys = Object.keys(idx);
  if (keys.length === 0) return null;
  const ils = [...new Set(keys.map(k => +k.split(',')[0]))].sort((a,b) => a-b);
  const ols = [...new Set(keys.map(k => +k.split(',')[1]))].sort((a,b) => a-b);
  const grid = ils.map(il => ols.map(ol => { const v = idx[`${il},${ol}`]; return v !== undefined ? v : null; }));
  return { input_lens: ils, output_lens: ols, grid };
}

function svgHeatmap(data, opts) {
  const { title, subtitle, colorFn, fmt, colorbarStops, colorbarLabels } = opts;
  const nR = data.input_lens.length, nC = data.output_lens.length;
  const gridW = opts.gridW || 320;
  const gridH = opts.gridH || 320;
  const cellW = gridW / nC, cellH = gridH / nR;
  const xLabelEvery = opts.xLabelEvery || 1;
  const cbW = 14, cbGap = 12;
  const pad = { l: 72, r: cbGap + cbW + 40, t: 44, b: 52 };
  const w = pad.l + gridW + pad.r;
  const h = pad.t + gridH + pad.b;

  let svg = `<svg xmlns="http://www.w3.org/2000/svg" width="${w}" height="${h}" style="font-family:'JetBrains Mono','Inter',monospace">`;

  // Title
  svg += `<text x="${pad.l + gridW/2}" y="18" text-anchor="middle" fill="#f0f0f0" font-size="13" font-weight="600" font-family="Inter,sans-serif">${title}</text>`;
  if (subtitle) {
    svg += `<text x="${pad.l + gridW/2}" y="33" text-anchor="middle" fill="#707070" font-size="14" font-family="Inter,sans-serif">${subtitle}</text>`;
  }

  // Cells — no borders
  for (let r = 0; r < nR; r++) {
    for (let c = 0; c < nC; c++) {
      const v = data.grid[r][c];
      const x = pad.l + c * cellW, y = pad.t + r * cellH;
      if (v === null) {
        svg += `<rect x="${x}" y="${y}" width="${cellW}" height="${cellH}" fill="#2a2a2a"/>`;
      } else {
        const bg = colorFn(v);
        const fg = textColor(bg);
        svg += `<rect x="${x}" y="${y}" width="${cellW}" height="${cellH}" fill="${bg}"/>`;
        if (cellW >= 10 && cellH >= 12) {
          svg += `<text x="${x+cellW/2}" y="${y+cellH/2+4}" text-anchor="middle" fill="${fg}" font-size="11" font-weight="700">${fmt(v)}</text>`;
        }
      }
    }
  }

  // Y-axis labels (input_lens)
  for (let r = 0; r < nR; r++) {
    svg += `<text x="${pad.l-6}" y="${pad.t + r*cellH + cellH/2 + 4}" text-anchor="end" fill="#b0b0b0" font-size="11">${data.input_lens[r]}</text>`;
  }
  // X-axis labels (output_lens)
  for (let c = 0; c < nC; c++) {
    if (c % xLabelEvery !== 0 && c !== nC - 1) continue;
    svg += `<text x="${pad.l + c*cellW + cellW/2}" y="${pad.t + gridH + 16}" text-anchor="middle" fill="#b0b0b0" font-size="11">${data.output_lens[c]}</text>`;
  }

  // Axis titles
  svg += `<text x="${pad.l + gridW/2}" y="${h-4}" text-anchor="middle" fill="#707070" font-size="14" font-family="Inter,sans-serif">${opts.xAxisLabel || 'Output Length'}</text>`;
  svg += `<text x="12" y="${pad.t + gridH/2}" text-anchor="middle" fill="#707070" font-size="14" font-family="Inter,sans-serif" transform="rotate(-90,12,${pad.t + gridH/2})">${opts.yAxisLabel || 'Input Length'}</text>`;

  // Colorbar
  if (colorbarStops && colorbarLabels) {
    const cbX = pad.l + gridW + cbGap;
    const cbH = gridH;
    const gradId = 'cg' + Math.random().toString(36).slice(2,8);
    svg += `<defs><linearGradient id="${gradId}" x1="0" y1="0" x2="0" y2="1">`;
    for (let i = 0; i < colorbarStops.length; i++) {
      const pct = (i / (colorbarStops.length - 1) * 100).toFixed(1);
      svg += `<stop offset="${pct}%" stop-color="${colorbarStops[i]}"/>`;
    }
    svg += `</linearGradient></defs>`;
    svg += `<rect x="${cbX}" y="${pad.t}" width="${cbW}" height="${cbH}" fill="url(#${gradId})"/>`;
    // Labels: top, middle, bottom
    for (let i = 0; i < colorbarLabels.length; i++) {
      const yPos = pad.t + (i / (colorbarLabels.length - 1)) * cbH + 4;
      svg += `<text x="${cbX + cbW + 4}" y="${yPos}" fill="#b0b0b0" font-size="11" font-family="Inter,sans-serif">${colorbarLabels[i]}</text>`;
    }
  }

  svg += '</svg>';
  return svg;
}

function deltaColorFn(inverted) {
  return function(v, vmax) {
    // map v from [-vmax, vmax] to [0, 1]
    let t = (v + vmax) / (2 * vmax);
    if (inverted) t = 1 - t; // latency: positive = bad = brown
    return lerpColor(BRBG, t);
  };
}

function seqColorFn(vmin, vmax) {
  return function(v) {
    const t = vmax > vmin ? (v - vmin) / (vmax - vmin) : 0.5;
    return lerpColor(SEQ, t);
  };
}

let currentBlockSize = '16';

function renderPerfHeatmaps() {
  const bs = currentBlockSize;
  const container = document.getElementById('perf-heatmaps');
  const allKeys = [...new Set([
    ...Object.keys(BENCH.latency || {}),
    ...Object.keys(BENCH.throughput || {}),
  ])].sort((a, b) => modelSortKey(a) - modelSortKey(b));

  let html = '';

  // One heatmap per latency CSV (one per model)
  html += `<div class="heatmap-section"><h3>Latency avg Δ% vs Python <span style="font-weight:400;color:var(--text-dim)">(+ = Rust slower)</span></h3><div class="heatmap-row">`;
  for (const key of allKeys) {
    const rows = (BENCH.latency || {})[key];
    if (!rows) continue;
    const data = buildDeltaGrid(rows, 'avg', bs);
    const flat = data.grid.flat().filter(v => v !== null);
    if (flat.length === 0) continue;
    const vmax = Math.max(1, ...flat.map(v => Math.abs(v)));
    const vmaxR = Math.round(vmax);
    const cfn = deltaColorFn(true);
    html += `<div class="plotly-hm">${svgHeatmap(data, {
      title: modelLabel(key), subtitle: null,
      colorFn: v => cfn(v, vmax),
      fmt: v => `${v >= 0 ? '+' : ''}${v.toFixed(1)}%`,
      colorbarStops: [...BRBG].reverse(),
      colorbarLabels: [`−${vmaxR}%`, '0%', `+${vmaxR}%`],
    })}</div>`;
  }
  html += '</div></div>';

  // One heatmap per throughput CSV (one per model)
  html += `<div class="heatmap-section"><h3>Throughput req/s Δ% vs Python <span style="font-weight:400;color:var(--text-dim)">(+ = Rust faster)</span></h3><div class="heatmap-row">`;
  for (const key of allKeys) {
    const rows = (BENCH.throughput || {})[key];
    if (!rows) continue;
    const data = buildDeltaGrid(rows, 'req_per_s', bs);
    const flat = data.grid.flat().filter(v => v !== null);
    if (flat.length === 0) continue;
    const vmax = Math.max(1, ...flat.map(v => Math.abs(v)));
    const vmaxR = Math.round(vmax);
    const cfn = deltaColorFn(false);
    html += `<div class="plotly-hm">${svgHeatmap(data, {
      title: modelLabel(key), subtitle: null,
      colorFn: v => cfn(v, vmax),
      fmt: v => `${v >= 0 ? '+' : ''}${v.toFixed(1)}%`,
      colorbarStops: [...BRBG].reverse(),
      colorbarLabels: [`+${vmaxR}%`, '0%', `−${vmaxR}%`],
    })}</div>`;
  }
  html += '</div></div>';

  container.innerHTML = html;
}

function renderServeHeatmaps() {
  const container = document.getElementById('serve-heatmaps');
  const serveKeys = Object.keys(BENCH.serve || {}).sort((a, b) => modelSortKey(a) - modelSortKey(b));

  // inverted=true  → positive delta = bad (lower-is-better metrics: TPOT, TTFT)
  // inverted=false → positive delta = good (higher-is-better metrics: tok/s, req/s)
  const metrics = [
    { field: 'output_tok_per_s', label: 'Serve output tok/s Δ% vs Python', inverted: false, sign: '+ = Rust faster', decimals: 0 },
    { field: 'req_per_s',        label: 'Serve req/s Δ% vs Python',         inverted: false, sign: '+ = Rust faster', decimals: 1 },
    { field: 'median_tpot_ms',   label: 'Serve median TPOT Δ% vs Python',   inverted: true,  sign: '+ = Rust slower', decimals: 1 },
    { field: 'median_ttft_ms',   label: 'Serve median TTFT Δ% vs Python',   inverted: true,  sign: '+ = Rust slower', decimals: 0 },
  ];

  let html = '';
  for (const { field, label, inverted, sign } of metrics) {
    // Check if any model has real python data for this metric
    const hasDelta = serveKeys.some(key => {
      const d = buildDeltaGrid(BENCH.serve[key], field, null);
      return d.grid.flat().some(v => v !== null);
    });

    const sectionSubtitle = hasDelta
      ? `<span style="font-weight:400;color:var(--text-dim)">(${sign})</span>`
      : `<span style="font-weight:400;color:var(--text-dim)">(Rust, L40S)</span>`;
    html += `<div class="heatmap-section"><h3>${label.replace(' Δ% vs Python', hasDelta ? ' Δ% vs Python' : '')} ${sectionSubtitle}</h3><div class="heatmap-row">`;

    // Compute shared scale across all models for absolute fallback
    const absGrids = hasDelta ? null : serveKeys.map(key => buildAbsGrid(BENCH.serve[key], field)).filter(Boolean);
    const absAllVals = absGrids ? absGrids.flatMap(d => d.grid.flat().filter(v => v !== null)) : [];
    const absVmin = absAllVals.length ? Math.min(...absAllVals) : 0;
    const absVmax = absAllVals.length ? Math.max(...absAllVals) : 1;
    const absFmt = v => decimals === 0 ? Math.round(v).toLocaleString() : v.toFixed(decimals);

    let absIdx = 0;
    for (const key of serveKeys) {
      if (hasDelta) {
        const data = buildDeltaGrid(BENCH.serve[key], field, null);
        const flat = data.grid.flat().filter(v => v !== null);
        if (flat.length === 0) continue;
        const vmax = Math.max(1, ...flat.map(v => Math.abs(v)));
        const vmaxR = Math.round(vmax);
        const cfn = deltaColorFn(inverted);
        html += `<div class="plotly-hm">${svgHeatmap(data, {
          title: modelLabel(key), subtitle: null,
          colorFn: v => cfn(v, vmax),
          fmt: v => `${v >= 0 ? '+' : ''}${v.toFixed(1)}%`,
          colorbarStops: [...BRBG].reverse(),
          colorbarLabels: inverted
            ? [`−${vmaxR}%`, '0%', `+${vmaxR}%`]
            : [`+${vmaxR}%`, '0%', `−${vmaxR}%`],
        })}</div>`;
      } else {
        const data = absGrids[absIdx++];
        if (!data) continue;
        const colorFn = inverted
          ? v => seqColorFn(absVmax, absVmin)(v)
          : seqColorFn(absVmin, absVmax);
        const stops = inverted ? [...SEQ].reverse() : SEQ;
        html += `<div class="plotly-hm">${svgHeatmap(data, {
          title: modelLabel(key), subtitle: null,
          colorFn, fmt: absFmt,
          colorbarStops: stops,
          colorbarLabels: inverted
            ? [absFmt(absVmax), absFmt((absVmin+absVmax)/2), absFmt(absVmin)]
            : [absFmt(absVmin), absFmt((absVmin+absVmax)/2), absFmt(absVmax)],
        })}</div>`;
      }
    }
    html += '</div></div>';
  }
  container.innerHTML = html;
}

// Block size selector
document.getElementById('bs-selector').addEventListener('click', function(e) {
  const btn = e.target.closest('button');
  if (!btn) return;
  this.querySelectorAll('button').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  currentBlockSize = btn.dataset.bs;
  renderPerfHeatmaps();
});

renderPerfHeatmaps();
renderServeHeatmaps();

function logTicks(xmin, xmax) {
  const candidates = [0.5, 1, 2, 3, 5, 10, 15, 20, 25, 30, 40, 50, 60, 70];
  return candidates.filter(v => v >= xmin * 0.85 && v <= xmax * 1.15);
}

function svgCdf(pyVals, rsVals, title) {
  const W = 420, H = 280;
  const pad = { l: 44, r: 16, t: 36, b: 44 };
  const plotW = W - pad.l - pad.r, plotH = H - pad.t - pad.b;

  function computeCdf(vals) {
    return [...vals].sort((a, b) => a - b).map((v, i, a) => ({ x: v, y: (i + 1) / a.length }));
  }

  const pyCdf = computeCdf(pyVals);
  const rsCdf = computeCdf(rsVals);
  const allVals = [...pyVals, ...rsVals];
  const xmin = Math.min(...allVals), xmax = Math.max(...allVals);
  const lxmin = Math.log10(xmin * 0.9), lxmax = Math.log10(xmax * 1.1);

  const mx = v => pad.l + (Math.log10(v) - lxmin) / (lxmax - lxmin) * plotW;
  const my = v => pad.t + (1 - v) * plotH;
  const clip = v => Math.max(0, Math.min(1, v));

  let svg = `<svg xmlns="http://www.w3.org/2000/svg" width="${W}" height="${H}" style="font-family:'Inter',sans-serif">`;

  // Plot area
  svg += `<rect x="${pad.l}" y="${pad.t}" width="${plotW}" height="${plotH}" fill="#1e1e1e" stroke="#3d3d3d" stroke-width="1"/>`;
  svg += `<defs><clipPath id="cp${title.replace(/\W/g,'')}"><rect x="${pad.l}" y="${pad.t}" width="${plotW}" height="${plotH}"/></clipPath></defs>`;
  const cp = `clip-path="url(#cp${title.replace(/\W/g,'')})"`;

  // Y grid + labels
  for (const yv of [0, 0.25, 0.5, 0.75, 1.0]) {
    const y = my(yv);
    svg += `<line x1="${pad.l}" y1="${y}" x2="${pad.l+plotW}" y2="${y}" stroke="#2d2d2d" stroke-width="1"/>`;
    svg += `<text x="${pad.l-5}" y="${y+4}" text-anchor="end" fill="#707070" font-size="10">${yv}</text>`;
  }

  // X grid + labels
  for (const xt of logTicks(xmin, xmax)) {
    const x = mx(xt);
    if (x < pad.l - 1 || x > pad.l + plotW + 1) continue;
    svg += `<line x1="${x}" y1="${pad.t}" x2="${x}" y2="${pad.t+plotH}" stroke="#2d2d2d" stroke-width="1"/>`;
    svg += `<text x="${x}" y="${pad.t+plotH+14}" text-anchor="middle" fill="#707070" font-size="10">${xt}s</text>`;
  }

  // CDF area + line
  function cdfShape(cdf, color) {
    const pts = cdf.map(p => `${mx(p.x).toFixed(1)},${my(p.y).toFixed(1)}`);
    const yBase = my(0);
    const xFirst = mx(cdf[0].x).toFixed(1);
    const xLast  = mx(cdf[cdf.length - 1].x).toFixed(1);
    const areaPts = [`${xFirst},${yBase}`, ...pts, `${xLast},${yBase}`].join(' ');
    return [
      `<polygon points="${areaPts}" fill="${color}" fill-opacity="0.12" stroke="none" ${cp}/>`,
      `<polyline points="${pts.join(' ')}" fill="none" stroke="${color}" stroke-width="2" stroke-linejoin="round" ${cp}/>`,
    ].join('');
  }
  svg += cdfShape(pyCdf, '#e06c75');
  svg += cdfShape(rsCdf, '#61afef');

  // Median dots + speedup annotation
  function median(vals) { const s = [...vals].sort((a,b)=>a-b); return s[Math.floor(s.length/2)]; }
  const pyMed = median(pyVals), rsMed = median(rsVals);
  const xPy = mx(pyMed), xRs = mx(rsMed), y50 = my(0.5);

  // Connecting line between the two medians
  const speedup = (pyMed / rsMed).toFixed(1);
  const xMid = (xPy + xRs) / 2;
  svg += `<line x1="${xRs}" y1="${y50}" x2="${xPy}" y2="${y50}" stroke="#aaa" stroke-width="1.5" stroke-dasharray="4,3" ${cp}/>`;
  // Arrowheads (left pointing toward Rust, right pointing toward Python)
  svg += `<polygon points="${xRs+1},${y50} ${xRs+8},${y50-4} ${xRs+8},${y50+4}" fill="#aaa" ${cp}/>`;
  svg += `<polygon points="${xPy-1},${y50} ${xPy-8},${y50-4} ${xPy-8},${y50+4}" fill="#aaa" ${cp}/>`;
  // Label above the midpoint
  svg += `<text x="${xMid}" y="${y50-8}" text-anchor="middle" fill="#e0e0e0" font-size="11" font-weight="600">${speedup}× faster</text>`;

  // Median dots
  for (const [x, color] of [[xPy,'#e06c75'],[xRs,'#61afef']]) {
    svg += `<circle cx="${x}" cy="${y50}" r="3.5" fill="${color}" ${cp}/>`;
  }

  // Legend
  const lx = pad.l + 8;
  svg += `<line x1="${lx}" y1="${pad.t+10}" x2="${lx+16}" y2="${pad.t+10}" stroke="#e06c75" stroke-width="2"/>`;
  svg += `<text x="${lx+20}" y="${pad.t+14}" fill="#b0b0b0" font-size="11">Python (med: ${pyMed.toFixed(1)}s)</text>`;
  svg += `<line x1="${lx}" y1="${pad.t+24}" x2="${lx+16}" y2="${pad.t+24}" stroke="#61afef" stroke-width="2"/>`;
  svg += `<text x="${lx+20}" y="${pad.t+28}" fill="#b0b0b0" font-size="11">Rust (med: ${rsMed.toFixed(2)}s)</text>`;

  // Title + axis labels
  svg += `<text x="${W/2}" y="20" text-anchor="middle" fill="#f0f0f0" font-size="13" font-weight="600">${title}</text>`;
  svg += `<text x="${pad.l+plotW/2}" y="${H-4}" text-anchor="middle" fill="#707070" font-size="11">startup time (s, log scale)</text>`;
  svg += `<text x="10" y="${pad.t+plotH/2}" text-anchor="middle" fill="#707070" font-size="11" transform="rotate(-90,10,${pad.t+plotH/2})">CDF</text>`;

  svg += '</svg>';
  return svg;
}

function renderStartupCdfs() {
  const container = document.getElementById('startup-heatmaps');
  const warmKeys = Object.keys(BENCH.startup_warm || {}).sort((a, b) => modelSortKey(a) - modelSortKey(b));
  if (warmKeys.length === 0) { container.innerHTML = ''; return; }

  let html = '';

  // Warm chart
  html += `<div class="heatmap-section"><h3>Startup time CDF — warm <span style="font-weight:400;color:var(--text-dim)">(100 iterations, log scale)</span></h3><div class="heatmap-row">`;
  for (const key of warmKeys) {
    const rows = BENCH.startup_warm[key];
    const pyVals = rows.filter(r => r.engine === 'python' && typeof r.startup_s === 'number').map(r => r.startup_s);
    const rsVals = rows.filter(r => r.engine === 'rust'   && typeof r.startup_s === 'number').map(r => r.startup_s);
    if (rsVals.length === 0 || pyVals.length === 0) continue;
    html += `<div class="plotly-hm">${svgCdf(pyVals, rsVals, modelLabel(key))}</div>`;
  }
  html += '</div></div>';

  // Cold chart — Python cold vs Rust warm (warm ≈ cold for Rust)
  const coldKeys = Object.keys(BENCH.startup_cold || {}).sort((a, b) => modelSortKey(a) - modelSortKey(b));
  if (coldKeys.length > 0) {
    html += `<div class="heatmap-section"><h3>Startup time CDF — cold <span style="font-weight:400;color:var(--text-dim)">(100 iterations, log scale; Rust uses warm data)</span></h3><div class="heatmap-row">`;
    for (const key of coldKeys) {
      const coldRows = BENCH.startup_cold[key];
      const warmRows = (BENCH.startup_warm[key] || []);
      const pyVals = coldRows.filter(r => r.engine === 'python' && typeof r.startup_s === 'number').map(r => r.startup_s);
      const rsVals = warmRows.filter(r => r.engine === 'rust'   && typeof r.startup_s === 'number').map(r => r.startup_s);
      if (pyVals.length === 0 || rsVals.length === 0) continue;
      html += `<div class="plotly-hm">${svgCdf(pyVals, rsVals, modelLabel(key))}</div>`;
    }
    html += '</div></div>';
  }

  container.innerHTML = html;
}
renderStartupCdfs();
</script>
