[package]
name = "vllm-serve"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "HTTP (axum) and gRPC (tonic) serving layer for vLLM Rust port"

[features]
default = []
cuda = ["vllm-executor/cuda", "vllm-kernels/cuda"]
nccl = ["cuda", "vllm-kernels/nccl"]
profiling = ["vllm-executor/profiling", "vllm-kernels/profiling"]
metal = ["vllm-mlx"]
guided-decoding = ["vllm-executor/guided-decoding", "vllm-mlx?/guided-decoding"]
multimodal = ["vllm-model/multimodal"]
chat-template = ["minijinja", "minijinja-contrib"]
tls = ["axum-server", "rustls", "rustls-pemfile"]
metrics = ["prometheus"]
top = ["metrics"]
multiproc = ["vllm-engine/multiproc"]

[dependencies]
vllm-common = { workspace = true }
vllm-config = { workspace = true }
vllm-core = { workspace = true }
vllm-engine = { workspace = true }
vllm-executor = { workspace = true }
vllm-model = { workspace = true }
vllm-kernels = { workspace = true }
vllm-mlx = { workspace = true, optional = true }
candle-core = { workspace = true }
anyhow = { workspace = true }
axum = { workspace = true }
axum-server = { workspace = true, optional = true }
rustls = { workspace = true, optional = true }
rustls-pemfile = { workspace = true, optional = true }
tokio = { workspace = true }
tokio-stream = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
tower = { workspace = true }
tower-http = { version = "0.6", features = ["cors", "trace"] }
uuid = { version = "1", features = ["v4"] }
http = "1"
tokenizers = { workspace = true }
rayon = { workspace = true }
minijinja = { workspace = true, optional = true }
minijinja-contrib = { workspace = true, optional = true }
prometheus = { workspace = true, optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util", "macros"] }
http-body-util = "0.1"
rcgen = { workspace = true }
reqwest = { workspace = true }
tempfile = { workspace = true }
vllm-protocol = { workspace = true }
