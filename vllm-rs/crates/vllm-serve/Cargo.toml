[package]
name = "vllm-serve"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "HTTP (axum) and gRPC (tonic) serving layer for vLLM Rust port"

[features]
default = []
metal = ["vllm-mlx"]

[dependencies]
vllm-common = { workspace = true }
vllm-config = { workspace = true }
vllm-engine = { workspace = true }
vllm-executor = { workspace = true }
vllm-model = { workspace = true }
vllm-mlx = { workspace = true, optional = true }
candle-core = { workspace = true }
anyhow = { workspace = true }
axum = { workspace = true }
axum-server = { workspace = true }
rustls = { workspace = true }
rustls-pemfile = { workspace = true }
tokio = { workspace = true }
tokio-stream = "0.1"
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
tower = { workspace = true }
tower-http = { version = "0.6", features = ["cors", "trace"] }
uuid = { version = "1", features = ["v4"] }
http = "1"
tokenizers = { workspace = true }
minijinja = { workspace = true }
minijinja-contrib = { workspace = true }
prometheus = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util", "macros"] }
http-body-util = "0.1"
rcgen = { workspace = true }
reqwest = { workspace = true }
tempfile = { workspace = true }
