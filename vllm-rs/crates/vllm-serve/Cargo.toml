[package]
name = "vllm-serve"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "HTTP (axum) and gRPC (tonic) serving layer for vLLM Rust port"

[features]
default = []
otel = ["vllm-common/otel"]
cuda = ["vllm-executor/cuda", "dep:vllm-cuda", "dep:ferrite-forward", "ferrite-forward/cuda"]
nccl = ["cuda", "vllm-cuda/nccl", "vllm-executor/nccl", "ferrite-forward/nccl"]
metal = ["vllm-mlx"]
wgpu = ["vllm-wgpu"]
guided-decoding = ["vllm-executor/guided-decoding", "vllm-mlx?/guided-decoding"]
multimodal = ["vllm-model/multimodal", "dep:image"]
tls = ["axum-server", "rustls", "rustls-pemfile"]
metrics = ["prometheus"]
top = ["metrics"]
multiproc = ["vllm-engine/multiproc"]
rag = ["spnl-core/rag", "dep:leann-core", "dep:ndarray", "dep:reqwest"]

[dependencies]
vllm-common = { workspace = true }
vllm-config = { workspace = true }
vllm-core = { workspace = true }
vllm-engine = { workspace = true }
vllm-executor = { workspace = true }
vllm-model = { workspace = true }
ferrite-gguf = { workspace = true }
ferrite-vision = { workspace = true }
ferrite-forward = { workspace = true, optional = true }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"], optional = true }
vllm-mlx = { workspace = true, optional = true }
vllm-wgpu = { workspace = true, optional = true, features = ["worker"] }
vllm-cuda = { path = "../vllm-cuda", optional = true }
anyhow = { workspace = true }
axum = { workspace = true }
axum-server = { workspace = true, optional = true }
rustls = { workspace = true, optional = true }
rustls-pemfile = { workspace = true, optional = true }
tokio = { workspace = true }
tokio-stream = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
tower = { workspace = true }
tower-http = { version = "0.6", features = ["cors", "trace"] }
uuid = { version = "1", features = ["v4"] }
rand = { workspace = true }
http = "1"
tokenizers = { workspace = true }
ouroboros = "0.18"
rayon = { workspace = true }
bincode = { workspace = true }
libc = { workspace = true }
minijinja = { workspace = true }
minijinja-contrib = { workspace = true }
chrono = { workspace = true }
prometheus = { workspace = true, optional = true }
indicatif = { workspace = true }
spnl-core = { workspace = true }
leann-core = { workspace = true, optional = true }
ndarray = { workspace = true, optional = true }
reqwest = { workspace = true, optional = true, features = ["blocking"] }
itertools = "0.14"

[dev-dependencies]
tokio = { workspace = true, features = ["test-util", "macros"] }
http-body-util = "0.1"
rcgen = { workspace = true }
reqwest = { workspace = true }
tempfile = { workspace = true }
vllm-protocol = { workspace = true }
