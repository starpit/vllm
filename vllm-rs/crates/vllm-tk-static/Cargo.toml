[package]
name = "vllm-tk-static"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
cuda = ["dep:cudaforge", "dep:dirs", "dep:cudarc"]

[dependencies]
vllm-tk-macros = { path = "../vllm-tk-macros" }
cudarc = { workspace = true, optional = true, features = ["dynamic-linking", "cuda-version-from-build-system"] }

[dev-dependencies]
vllm-tk = { path = "../vllm-tk", features = ["cuda"] }
vllm-cuda = { path = "../vllm-cuda", features = ["cuda"] }
cudarc = { workspace = true, features = ["dynamic-linking", "cuda-version-from-build-system"] }
hf-hub = "0.4"
serde_json = "1"
half = "2"

[build-dependencies]
vllm-tk-macros-core = { path = "../vllm-tk-macros-core" }
cudaforge = { path = "../../third_party/cudaforge", optional = true }
dirs = { version = "6", optional = true }
