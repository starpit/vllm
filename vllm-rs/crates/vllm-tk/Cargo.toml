[package]
name = "vllm-tk"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "ThunderKittens KVM megakernel for sm89 — compiles and exposes the TK LLaMA kernel"

[features]
default = []
# Actually compile and link the TK CUDA kernel. Without this feature,
# the crate is a no-op stub (for CI/non-CUDA builds).
cuda = ["dep:cudaforge", "dep:dirs", "dep:vllm-cuda", "dep:cudarc"]

[dependencies]
vllm-cuda = { path = "../vllm-cuda", features = ["cuda"], optional = true }
cudarc = { workspace = true, optional = true }
anyhow = { workspace = true }
tracing = { workspace = true }

[build-dependencies]
cudaforge = { path = "../../third_party/cudaforge", optional = true }
dirs = { version = "6", optional = true }
