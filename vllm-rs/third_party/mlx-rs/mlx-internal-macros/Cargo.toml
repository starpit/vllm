[package]
name = "mlx-internal-macros"
version = "0.25.3"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Internal procedural macros for mlx-rs"

[lib]
proc-macro = true

[dependencies]
syn = { version = "2", features = ["full"] }
quote = "1"
darling = "0.20"
proc-macro2 = "1"
itertools = "0.14"
