[package]
name = "mlx-rs"
version = "0.25.3"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Unofficial rust wrapper for Apple's mlx machine learning library."
readme = "README.md"

[package.metadata.docs.rs]
targets = [
  "aarch64-apple-darwin",
  "aarch64-apple-ios",
  "aarch64-apple-ios-sim",
]

[dependencies]
mlx-sys = { path = "../mlx-sys" }
mlx-internal-macros = { path = "../mlx-internal-macros" }
mlx-macros = { path = "../mlx-macros" }
dyn-clone = "1"
half = "2"
mach-sys = "0.5"
num-complex = "0.4"
num_enum = "0.7"
num-traits = "0.2"
paste = "1"
smallvec = "1"
strum = { version = "0.27", features = ["derive"] }
thiserror = "2"
libc = "0.2"
parking_lot = "0.12"
itertools = "0.14"

# optional dependencies
safetensors = { version = "0.5", optional = true }
bytemuck = { version = "1", optional = true, features = ["extern_crate_std"] }

[features]
default = ["accelerate", "metal"]

accelerate = ["mlx-sys/accelerate"]
metal = ["mlx-sys/metal"]

# Enables conversion between `Array` and `safetensors::TensorView`
safetensors = ["dep:safetensors", "dep:bytemuck"]
